<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zot · knowledge graph</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #sidebar {
        width: 320px;
        flex: 0 0 320px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      #cy { flex: 1; height: 100%; background: var(--bg); }
      .section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
      h1 { font-size: 15px; margin: 0 0 2px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
      .stat { color: var(--muted); font-size: 12px; }
      label.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
      input[type="search"], select {
        width: 100%; padding: 7px 9px; background: var(--bg);
        border: 1px solid var(--border); color: var(--text); border-radius: 6px;
      }
      input[type="range"] { width: 100%; }
      .val { color: var(--accent); font-variant-numeric: tabular-nums; }
      button {
        width: 100%; padding: 8px; margin-top: 8px; cursor: pointer;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px;
      }
      button:hover { border-color: var(--accent); }
      #detail .title { font-weight: 600; margin-bottom: 6px; }
      #detail .field { margin: 4px 0; }
      #detail .k { color: var(--muted); }
      #detail a { color: var(--accent); text-decoration: none; word-break: break-all; }
      #detail .tag {
        display: inline-block; padding: 1px 7px; margin: 2px 3px 0 0;
        background: #21262d; border-radius: 10px; font-size: 11px;
      }
      .empty { color: var(--muted); font-style: italic; }
      #legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 12px; }
      #loading { position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="section">
        <h1>Knowledge Graph</h1>
        <div class="stat" id="scope">—</div>
        <div class="stat" id="counts">—</div>
      </div>
      <div class="section">
        <h2>Filters</h2>
        <input type="search" id="search" placeholder="Search title / author…" />
        <label class="row" style="margin-top:10px;">
          Min edge weight <span class="val" id="minWeightVal">2</span>
        </label>
        <input type="range" id="minWeight" min="0" max="100" value="2" />
        <label class="row" style="margin-top:10px;">
          Min degree <span class="val" id="minDegreeVal">1</span>
        </label>
        <input type="range" id="minDegree" min="0" max="50" value="1" />
        <div style="margin-top:10px;">
          <label class="row"><input type="checkbox" class="rel" value="coauthor" checked /> Co-author</label>
          <label class="row"><input type="checkbox" class="rel" value="tag" checked /> Shared tag</label>
          <label class="row"><input type="checkbox" class="rel" value="collection" checked /> Same collection</label>
          <label class="row"><input type="checkbox" class="rel" value="related" checked /> Related (Zotero)</label>
        </div>
        <button id="relayout">Re-run layout</button>
      </div>
      <div class="section">
        <h2>Selection</h2>
        <div id="detail"><div class="empty">Click a node to inspect it.</div></div>
      </div>
      <div class="section">
        <h2>Top communities</h2>
        <div id="legend"></div>
      </div>
    </div>
    <div id="cy"></div>
    <div id="loading">Loading graph…</div>
    <script src="/cytoscape.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
