version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "uuid"
        versions: [">= 1.24.0"]
      - dependency-name: "sha2"
        versions: [">= 0.11.0"]
      - dependency-name: "quick-xml"
        versions: [">= 0.42.0"]
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Toolchain refs select a compiler. They are not action versions.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - dependencies
      - ci
