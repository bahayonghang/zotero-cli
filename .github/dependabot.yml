version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Toolchain refs select a compiler. They are not action versions.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - dependencies
      - ci
